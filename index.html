async function loadFromSupabase(){

async function uploadCSVToSupabase(){
  if(!confirm('Upload 209 data CSV kamu ke Supabase? Ini akan menimpa data di Supabase biar bisa diakses semua HP!')) return;
  toast('⏳ Uploading 209 ke Supabase...');
  try{
    // First delete existing if any (optional)
    // await supabaseClient.from('generus').delete().neq('id',0);
    const toUpload = GENERUS_CSV.map(g=>({ nama:g.nama, ttl:g.ttl, usia:g.usia, kategori:g.kategori, gender:g.gender, kelompok:g.kelompok, nama_ortu:g.nama_ortu, hp_ortu:g.hp_ortu, status_kenaikan:g.status_kenaikan }));
    const {data, error} = await supabaseClient.from('generus').upsert(toUpload, {onConflict:'nama'}).select();
    if(error) throw error;
    toast('✅ Berhasil upload '+toUpload.length+' ke Supabase! Sekarang semua HP bisa lihat!');
    supaConnected = true;
    render();
  } catch(e){
    toast('❌ Upload gagal: '+e.message + ' - Cek SQL di bawah');
    console.error(e);
    // Show SQL creation help
    document.getElementById('sqlHelp').classList.remove('hidden');
  }
}

    let list = generusData.filter(g=>{ const mq = q==='' || g.nama.toLowerCase().includes(q.toLowerCase()); const mk = fKel==='Semua' || g.kelompok===fKel; const mj = fJen==='Semua' || (g.jenjang||g.kategori)===fJen; return mq && mk && mj; });
    let htmlList = list.slice(0,120).map(g=>'<div class="card p-3"><p class="font-bold text-[13px]">'+g.nama+'</p><p class="text-[10px] text-neutral-500">'+(g.kelompok||'')+' • '+(g.jenjang||g.kategori||'')+' • '+(g.umur||g.usia||'')+'th • '+(g.gender||'')+'</p><p class="text-[10px]">Ortu: '+(g.ortu||g.nama_ortu||'-')+' • '+(g.hp||g.hp_ortu||'')+'</p></div>').join('');
    content='<div class="flex justify-between items-center mb-3"><h2 class="font-black">Generus '+generusData.length+' REAL CSV (Supabase)</h2><div class="flex gap-2"><button onclick="loadFromSupabase()" class="h-9 px-3 rounded-xl bg-green-700 text-white font-bold text-[11px]">Sync Supabase</button><button onclick="uploadCSVToSupabase()" class="h-9 px-3 rounded-xl bg-blue-600 text-white font-bold text-[11px]">Upload</button></div></div><div class="card p-3 mb-3 flex flex-wrap gap-2"><input value="'+q+'" oninput="q=this.value;render()" placeholder="Cari nama..." class="h-9 px-3 rounded-xl border text-[12px] w-[150px]"><select onchange="fKel=this.value;render()" class="h-9 border rounded-xl text-[11px]"><option>Semua</option><option>Anggaraja</option><option>Annur</option><option>Buciper</option><option>Dayang Sumbi</option><option>Padasuka</option><option>Sriwijaya</option></select><select onchange="fJen=this.value;render()" class="h-9 border rounded-xl text-[11px]"><option>Semua</option><option>Belum Paud</option><option>Paud</option><option>Caberawit</option><option>Pra Remaja</option><option>Remaja</option><option>Pra-Nikah</option></select><span class="text-[11px] py-2 font-bold">Hasil:'+list.length+'</span></div><div class="grid md:grid-cols-3 gap-2">'+htmlList+'</div>';
  } else if(tab==='kurikulum'){
    const jenjangs=[...new Set(kurikulum.map(k=>k.jenjang))];
    let htmlJen=''; jenjangs.forEach(j=>{ const list=kurikulum.filter(k=>k.jenjang===j); const cards=list.map(k=>'<div class="rounded-2xl border bg-neutral-50 p-3"><p class="font-bold text-[13px]">'+k.materi+'</p><p class="text-[11px] text-neutral-600">'+k.capaian+'</p><div class="mt-2 flex gap-2"><button onclick="editKurikulum(\''+k.id+'\')" class="flex-1 h-8 rounded-xl bg-blue-600 text-white font-bold text-[11px]">Edit</button><button onclick="hapusKurikulum(\''+k.id+'\')" class="flex-1 h-8 rounded-xl bg-red-50 text-red-600 border font-bold text-[11px]">Hapus</button></div></div>').join(''); htmlJen+='<div class="card p-4 mb-3"><div class="flex justify-between"><h3 class="font-black">'+j+'</h3><span class="px-2 py-1 rounded-full bg-green-700 text-white text-[10px] font-bold">'+list.length+'</span></div><div class="grid md:grid-cols-2 gap-3 mt-3">'+cards+'</div></div>'; });
    content='<div class="flex justify-between mb-3"><h2 class="font-black">Kurikulum '+kurikulum.length+' (Editable)</h2><button onclick="tambahKurikulum()" class="h-9 px-4 rounded-xl bg-green-700 text-white font-bold text-[12px]">+ Tambah</button></div>'+htmlJen;
  } else if(tab==='ustadz'){
    let uHtml=ustadzData.map(u=>'<div class="card p-4"><p class="font-black text-[13px]">'+u.nama+'</p><p class="text-[11px] text-neutral-500">'+u.kelompok+' • '+u.spesialis+'</p><p class="text-[11px]">📱 '+u.hp+'</p><div class="mt-2 flex gap-2"><button onclick="editUstadz(\''+u.id+'\')" class="flex-1 h-8 rounded-xl bg-blue-600 text-white font-bold text-[11px]">Edit</button><button onclick="hapusUstadz(\''+u.id+'\')" class="flex-1 h-8 rounded-xl bg-red-50 text-red-600 border font-bold text-[11px]">Hapus</button></div></div>').join('');
    content='<div class="flex justify-between mb-3"><h2 class="font-black">Ustadz '+ustadzData.length+' (Editable)</h2><button onclick="tambahUstadz()" class="h-9 px-4 rounded-xl bg-green-700 text-white font-bold text-[12px]">+ Tambah</button></div><div class="grid md:grid-cols-3 gap-3">'+uHtml+'</div>';
  }
  app.innerHTML='<div class="flex min-h-screen"><div class="w-[240px] bg-white border-r p-4 hidden md:block"><div class="font-black text-[12px]">GENERUS MAHKOTA</div><div class="text-[9px] '+(supaConnected?'text-green-600':'text-amber-600')+'">'+(supaConnected?'● SUPABASE ONLINE':'● LOCAL MODE')+'</div><div class="mt-6 space-y-1"><button onclick="tab=\'dashboard\';render()" class="w-full text-left px-3 py-2 rounded-xl '+(tab==='dashboard'?'bg-green-700 text-white font-bold':'hover:bg-neutral-100')+'">📊 Dashboard</button><button onclick="tab=\'generus\';render()" class="w-full text-left px-3 py-2 rounded-xl '+(tab==='generus'?'bg-green-700 text-white font-bold':'hover:bg-neutral-100')+'">👥 Generus '+generusData.length+'</button><button onclick="tab=\'kurikulum\';render()" class="w-full text-left px-3 py-2 rounded-xl '+(tab==='kurikulum'?'bg-green-700 text-white font-bold':'hover:bg-neutral-100')+'">📚 Kurikulum</button><button onclick="tab=\'ustadz\';render()" class="w-full text-left px-3 py-2 rounded-xl '+(tab==='ustadz'?'bg-green-700 text-white font-bold':'hover:bg-neutral-100')+'">👨‍🏫 Ustadz</button><button onclick="loadFromSupabase()" class="w-full text-left px-3 py-2 rounded-xl bg-green-50 text-green-700 font-bold mt-4">🔄 Sync Supabase</button><button onclick="uploadCSVToSupabase()" class="w-full text-left px-3 py-2 rounded-xl bg-blue-50 text-blue-700 font-bold">⬆️ Upload CSV</button><button onclick="logout()" class="w-full text-left px-3 py-2 rounded-xl text-red-600 mt-6">Logout</button></div></div><div class="flex-1"><div class="p-4 max-w-[1300px] mx-auto">'+content+'</div></div></div>';
}
function tambahKurikulum(fj){ let jenjang=fj||prompt('Jenjang:','Paud'); if(!jenjang) return; let materi=prompt('Materi:'); if(!materi) return; kurikulum.push({id:'k'+Date.now(), jenjang, materi, capaian:'', buku:'', quran:'', semester:1}); saveAll(); render(); }
function editKurikulum(id){ const k=kurikulum.find(x=>x.id===id); const materi=prompt('Materi:',k.materi); if(materi) k.materi=materi; saveAll(); render(); }
function hapusKurikulum(id){ kurikulum=kurikulum.filter(x=>x.id!==id); saveAll(); render(); }
function tambahUstadz(){ let nama=prompt('Nama:'); if(!nama) return; ustadzData.push({id:'u'+Date.now(), nama, kelompok:'Anggaraja', hp:'', spesialis:''}); saveAll(); render(); }
function editUstadz(id){ const u=ustadzData.find(x=>x.id===id); const nama=prompt('Nama:',u.nama); if(nama) u.nama=nama; saveAll(); render(); }
function hapusUstadz(id){ ustadzData=ustadzData.filter(x=>x.id!==id); saveAll(); render(); }

testSupabase();
render();
</script></body></html>
