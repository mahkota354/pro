function login(){
  const u = document.getElementById('u').value;
  const p = document.getElementById('p').value;
  if((u==='superadmin' && p==='123456') || (u==='anggaraja' && p==='123456') || (u && p)){
    localStorage.setItem('role_mahkota','superadmin');
    role='superadmin';
    render();
  } else alert('Gunakan superadmin / 123456');
}
function logout(){ localStorage.removeItem('role_mahkota'); role=null; render(); }

function editKurikulum(id){
  const k = kurikulum.find(x=>x.id===id);
  if(!k) return;
  const materi = prompt('Edit Materi:', k.materi);
  if(materi===null) return;
  const capaian = prompt('Edit Capaian:', k.capaian);
  if(capaian===null) return;
  const buku = prompt('Edit Buku:', k.buku);
  if(buku===null) return;
  const quran = prompt('Edit Quran:', k.quran);
  if(quran===null) return;
  k.materi=materi; k.capaian=capaian; k.buku=buku; k.quran=quran;
  saveKur(); render();
  alert('✅ Kurikulum diupdate!');
}
function hapusKurikulum(id){
  if(!confirm('Hapus materi ini?')) return;
  kurikulum = kurikulum.filter(x=>x.id!==id);
  saveKur(); render();
}
function tambahKurikulum(jenjangFix){
  let jenjang = jenjangFix || prompt('Jenjang (Belum Paud/Paud/Caberawit/Pra Remaja/Remaja):','Paud');
  if(!jenjang) return;
  let materi = prompt('Nama Materi:');
  if(!materi) return;
  let capaian = prompt('Capaian:','Mampu memahami '+materi);
  let buku = prompt('Buku:','Buku '+jenjang);
  let quran = prompt('Quran:','Juz 30');
  kurikulum.push({id:'k'+Date.now(), jenjang, materi, capaian, buku, quran, semester:1});
  saveKur(); render();
  alert('✅ Ditambah!');
}
function resetKurikulum(){
  if(!confirm('Reset ke 30 materi default?')) return;
  localStorage.removeItem('kurikulum_mahkota_final');
  kurikulum = [...KUR_DEFAULT];
  saveKur(); render();
}
